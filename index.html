<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Frontend Mentor | Blog preview card</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <article class="card">

      <img 
        src="./assets/images/illustration-article.svg" 
        alt="Illustration of an article" 
        class="card-image"
      >

      <div class="text">
        <span class="tag">Learning</span>
        <p class="date">Published 21 Dec 2023</p>

        <h1 class="title">HTML & CSS foundations</h1>

        <p class="description">
          These are the building blocks of the web, and mastering them is essential for any aspiring web developer.
        </p>
      </div>

      <div class="author">
        <img 
          src="./assets/images/image-avatar.webp" 
          alt="Avatar of Greg Hooper" 
          class="avatar"
        >
        <span class="name">Greg Hooper</span>
      </div>

    </article>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Valeria</a>.
  </footer>

</body>
</html>
